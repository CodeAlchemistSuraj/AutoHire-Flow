spring:
  application:
    name: autohire-flow
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Ollama configuration
ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  embedding-model: nomic-embed-text
  chat-model: mistral
  timeout: 30000
  max-retries: 3

# Security
jwt:
  secret: ${JWT_SECRET:default-secret-key-change-in-production}
  expiration: 86400000  # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# Rate limiting
rate-limiting:
  enabled: true
  default-limit: 100
  ai-endpoints-limit: 30
  duration-minutes: 1

# Logging
logging:
  level:
    root: INFO
    com.autohire.flow: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/autohire-flow.log
    max-size: 10MB
    max-history: 10

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
